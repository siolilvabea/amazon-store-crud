<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro | Amazon Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">amazon<span>store</span></a>
    </header>
    <div class="container">
        <h2>Criar conta Amazon</h2>
        <form id="form-cadastro" class="form-grid">
            <div class="form-group">
                <label>Nome</label>
                <input type="text" id="nome" required>
            </div>
            <div class="form-group">
                <label>Sobrenome</label>
                <input type="text" id="sobrenome" required>
            </div>
            <div class="form-group">
                <label>CPF</label>
                <input type="text" id="cpf" placeholder="000.000.000-00" maxlength="14" minlength="14" required>
            </div>
            <div class="form-group">
                <label>Telefone</label>
                <input type="text" id="telefone" required>
            </div>
            <div class="form-group">
                <label>E-mail</label>
                <input type="email" id="email" required>
            </div>
            <div class="form-group">
                <label>Senha</label>
                <input type="password" id="senha" required>
            </div>
            <div class="form-group">
                <label>Rua</label>
                <input type="text" id="rua" required>
            </div>
            <div class="form-group">
                <label>CEP</label>
                <input type="text" id="cep" placeholder="00000-000" maxlength="9" minlength="9" required>
            </div>
            <div class="form-group">
                <label>Cidade</label>
                <input type="text" id="cidade" required>
            </div>
            <div class="form-group">
                <label>Estado</label>
                <input type="text" id="estado" maxlength="2" required>
            </div>
            <div class="form-group full-width">
                <button type="submit" class="btn" style="margin-top: 15px;">Cadastrar</button>
            </div>
        </form>
        <div class="link-box">
            <p>Já tem uma conta? <a href="login.html">Fazer login</a></p>
        </div>
    </div>
    <script src="cadastro.js"></script>

<script src="cadastro.js"></script>

    <script>
        // Funções para preencher e limpar os campos automaticamente
        const preencherFormulario = (endereco) => {
            document.getElementById("rua").value = endereco.logradouro;
            document.getElementById("cidade").value = endereco.localidade;
            document.getElementById("estado").value = endereco.uf;
        }

        const limparFormulario = () => {
            document.getElementById("rua").value = "";
            document.getElementById("cidade").value = "";
            document.getElementById("estado").value = "";
        }

        // Valida se o CEP tem 8 números
        const cepValido = (cep) => cep.length === 8;

        // Função principal de busca na API
        const pesquisarCep = async () => {
            // Pega o valor e remove qualquer traço ou ponto que o usuário tenha digitado
            const cep = document.getElementById("cep").value.replace(/\D/g, ''); 
            const url = `https://viacep.com.br/ws/${cep}/json/`;

            if (cepValido(cep)) {
                try {
                    const dados = await fetch(url);
                    const endereco = await dados.json();

                    if (endereco.hasOwnProperty('erro')) {
                        alert("CEP não encontrado!");
                        limparFormulario();
                    } else {
                        preencherFormulario(endereco);
                    }
                } catch (erro) {
                    alert("Erro ao buscar o CEP!");
                }
            } else {
                if (cep.length > 0) {
                    alert("CEP inválido! Digite 8 números.");
                    limparFormulario();
                }
            }
        }

        // Dispara a busca quando o usuário clica fora do campo de CEP
        document.getElementById("cep").addEventListener("focusout", pesquisarCep);
    </script>
</body>
</html>
