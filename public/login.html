<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Login | Amazon Store</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <a href="index.html" class="logo">amazon<span>store</span></a>
    </header>
    <div class="container" style="max-width: 420px;">
        <h2>Fazer Login</h2>
        <form id="form-login">
            <div class="form-group">
                <label for="email">E-mail ou CPF</label>
                <input type="text" id="email" placeholder="E-mail ou CPF" required>
            </div>
            <div class="form-group">
                <label for="senha">Senha</label>
                <input type="password" id="senha" placeholder="Senha" required>
            </div>
            <button type="submit" class="btn" style="margin-top: 10px;">Entrar</button>
        </form>
        <div class="link-box">
            <p>Novo na Amazon Store? <a href="cadastro.html">Criar sua conta</a></p>
        </div>
    </div>
    <script src="login.js"></script>
</body>
</html>
